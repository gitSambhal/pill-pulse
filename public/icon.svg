<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <!-- Pill Capsule Graphic -->
  <g transform="translate(256,256) rotate(-45) translate(-256,-256)">
    <!-- Pill body -->
    <rect x="156" y="106" width="200" height="300" rx="100" fill="#f8fafc" />
    <!-- Top Half -->
    <path d="M 156,206 A 100,100 0 0,1 356,206 L 356,256 L 156,256 Z" fill="url(#pillGrad)" />
    <!-- Pill Divider -->
    <line x1="156" y1="256" x2="356" y2="256" stroke="#0f172a" stroke-width="6" opacity="0.2" />
  </g>
  <!-- Vital Pulse Line in center -->
  <path d="M 170 340 L 220 340 L 240 280 L 270 380 L 300 320 L 320 340 L 350 340" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
</svg>
